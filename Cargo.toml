[package]
name = "deadcfg-sweep"
version = "0.1.0"
edition = "2021"
authors = ["SMK Telkom Developer <dev@smktelkom-mks.sch.id>"]
description = "AST-powered dead configuration key detector across codebase files with safe auto-prune"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
regex = "1.10"
walkdir = "2.5"
colored = "2.1"

[dev-dependencies]
tempfile = "3.10"
